<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Performance — Angular</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-title" id="brand-title">Angular</div>
      <div class="brand-sub" id="brand-sub">—</div>
    </div>
    <div class="topbar-actions">
      <nav class="tracks-nav">
        <a href="index.html">Overview</a>
        <a href="node.html">Node</a>
        <a href="angular.html" class="active">Angular</a>
        <a href="python.html">Python</a>
        <a href="cognizant.html">Cognizant</a>
      </nav>
      <button class="theme-toggle" title="Toggle theme" aria-label="Toggle theme">☾</button>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="hero-row">
    <div>
      <div class="hero-figure" id="hero-figure">—</div>
      <div class="hero-label">Complete</div>
    </div>
    <div class="hero-meta" id="hero-meta-lines"></div>
  </section>

  <section>
    <div class="stat-grid" id="stat-tiles"></div>
  </section>

  <section>
    <h2 class="section-title">Progress by phase</h2>
    <div class="chart-card">
      <div class="legend" id="legend"></div>
      <div class="view-toggle" id="phase-toggle">
        <button class="active">Chart</button>
        <button>Table</button>
      </div>
      <div id="phase-chart"></div>
      <div id="phase-table"></div>
    </div>
  </section>

  <section>
    <h2 class="section-title">Time &amp; pace</h2>
    <div class="stat-grid" id="time-stats"></div>
    <p class="track-current" id="pace-note" style="border:none;padding-top:12px;"></p>
    <div class="chart-card">
      <div id="time-log-table"></div>
    </div>
  </section>

  <section>
    <h2 class="section-title">Concept tracker</h2>
    <div class="chart-card">
      <div id="concept-table"></div>
    </div>
  </section>

  <section>
    <h2 class="section-title">Self-assessment checklist <span id="checklist-pct" style="text-transform:none;letter-spacing:0;color:var(--text-muted);font-weight:400;"></span></h2>
    <div id="checklist"></div>
  </section>

</main>

<footer>
  <span>Data generated <code id="generated-at">—</code> from <code>Angular/learning_tracker.xlsx</code>.</span>
  <span>Updated the tracker in Excel? Run <code>python dashboard/scripts/generate_data.py</code> from the repo root, then reload.</span>
</footer>

<script src="data/angular.data.js"></script>
<script src="assets/app.js"></script>
<script>
const TRACK_KEY = "angular";
document.addEventListener("DOMContentLoaded", () => {
  initTheme();
  const data = window.DASHBOARD_DATA[TRACK_KEY];
  const stats = computeStats(data);

  document.getElementById("brand-title").textContent = data.title;
  document.getElementById("brand-sub").textContent = data.subtitle;
  document.title = "Learning Performance — " + data.title;

  document.getElementById("hero-figure").textContent = stats.pctDone + "%";
  document.getElementById("hero-meta-lines").innerHTML = `
    <div class="hero-meta-line">${stats.counts["Done"]} of ${stats.total} concepts done</div>
    <div class="hero-meta-line">${stats.lastActivity ? "Last activity: " + stats.lastActivity : "No activity logged yet"}</div>
  `;

  renderStatTiles(document.getElementById("stat-tiles"), [
    { label: "Not started", value: stats.counts["Not Started"] },
    { label: "In progress", value: stats.counts["In Progress"] },
    { label: "Practiced", value: stats.counts["Practiced"] },
    { label: "Done", value: stats.counts["Done"], good: true },
  ]);

  renderLegend(document.getElementById("legend"));
  initPhaseBreakdown(
    document.getElementById("phase-chart"),
    document.getElementById("phase-table"),
    document.getElementById("phase-toggle"),
    stats.phases
  );

  const timeStats = computeTimeStats(data, stats);
  renderTimeStatTiles(document.getElementById("time-stats"), timeStats);
  renderPaceNote(document.getElementById("pace-note"), timeStats);
  renderTimeLogTable(document.getElementById("time-log-table"), timeStats.recent || []);

  renderConceptTable(document.getElementById("concept-table"), data.concepts);

  document.getElementById("checklist-pct").textContent = `(${stats.checklistDone}/${stats.checklistTotal} · ${stats.checklistPct}%)`;
  renderChecklist(document.getElementById("checklist"), data.checklist);

  document.getElementById("generated-at").textContent = data.generatedAt;
});
</script>
</body>
</html>
