<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACC Viewer Chat - 3D Model Intelligence</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Autodesk Viewer -->
    <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css">
    <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Main layout */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Viewer section */
        .viewer-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
        }

        .viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: #16213e;
            border-bottom: 1px solid #2d3a5c;
        }

        .viewer-header h1 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .viewer-header h1 svg {
            width: 20px;
            height: 20px;
            color: #3b82f6;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .model-selector label {
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .model-selector select {
            padding: 0.375rem 0.75rem;
            border: 1px solid #374151;
            border-radius: 0.375rem;
            background: #1f2937;
            color: #f9fafb;
            font-size: 0.875rem;
            min-width: 200px;
            cursor: pointer;
        }

        .model-selector select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .model-selector select option {
            background: #1f2937;
            color: #f9fafb;
        }

        .viewer-container {
            flex: 1;
            position: relative;
        }

        #viewer {
            width: 100%;
            height: 100%;
        }

        .viewer-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #9ca3af;
        }

        .viewer-loading svg {
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Chat section */
        .chat-section {
            width: 400px;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-left: 1px solid #e5e7eb;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e5e7eb;
            background: #f9fafb;
        }

        .chat-header svg {
            width: 20px;
            height: 20px;
            color: #3b82f6;
        }

        .chat-header span {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .chat-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 2rem;
            text-align: center;
            color: #9ca3af;
        }

        .chat-empty-state svg {
            width: 48px;
            height: 48px;
            color: #d1d5db;
            margin-bottom: 1rem;
        }

        .chat-empty-state p {
            margin: 0;
            font-size: 0.875rem;
        }

        /* Messages */
        .chat-message {
            display: flex;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.user {
            justify-content: flex-end;
        }

        .chat-message.agent {
            justify-content: flex-start;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .message-label {
            font-size: 0.675rem;
            color: #9ca3af;
            margin-bottom: 0.25rem;
        }

        .user .message-label {
            text-align: right;
        }

        .chat-bubble {
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .user .chat-bubble {
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .agent .chat-bubble {
            background: #f3f4f6;
            color: #1f2937;
            border-bottom-left-radius: 0.25rem;
            border: 1px solid #e5e7eb;
        }

        .agent-avatar {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background: #e0e7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.5rem;
            flex-shrink: 0;
        }

        .agent-avatar svg {
            width: 1.25rem;
            height: 1.25rem;
            color: #4f46e5;
        }

        /* Loading indicator */
        .chat-loading {
            display: none;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            color: #6b7280;
            font-size: 0.75rem;
        }

        .chat-loading.visible {
            display: flex;
        }

        .loading-dots {
            display: flex;
            gap: 0.25rem;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background: #3b82f6;
            border-radius: 50%;
            animation: loadingBounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes loadingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Sample queries */
        .sample-queries {
            padding: 0.5rem 1rem;
            border-top: 1px solid #f3f4f6;
            background: #f9fafb;
        }

        .sample-queries-label {
            font-size: 0.675rem;
            color: #9ca3af;
            margin-bottom: 0.5rem;
        }

        .sample-queries-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
        }

        .sample-query-btn {
            background: #fff;
            color: #6b7280;
            border: 1px solid #e5e7eb;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .sample-query-btn:hover {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        /* Input area */
        .chat-input-area {
            padding: 0.75rem 1rem;
            border-top: 1px solid #e5e7eb;
        }

        .chat-input-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 9999px;
            padding: 0.25rem 0.25rem 0.25rem 1rem;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .chat-input-wrapper:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .chat-input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 0.875rem;
            color: #1f2937;
        }

        .chat-input::placeholder {
            color: #9ca3af;
        }

        .chat-input:disabled {
            opacity: 0.6;
        }

        .send-btn {
            width: 2rem;
            height: 2rem;
            border: none;
            border-radius: 50%;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .send-btn:hover:not(:disabled) {
            background: #2563eb;
        }

        .send-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Status indicator */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .viewer-section {
                height: 50vh;
            }

            .chat-section {
                width: 100%;
                height: 50vh;
            }

            .model-selector {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Viewer Section -->
        <div class="viewer-section">
            <div class="viewer-header">
                <h1>
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                    </svg>
                    3D Model Viewer
                </h1>
                <div class="model-selector">
                    <label>Model:</label>
                    <select id="modelSelect">
                        <option value="">Loading models...</option>
                    </select>
                </div>
            </div>
            <div class="viewer-container">
                <div id="viewer"></div>
                <div class="viewer-loading" id="viewerLoading">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    <p>Initializing viewer...</p>
                </div>
            </div>
        </div>

        <!-- Chat Section -->
        <div class="chat-section">
            <div class="chat-header">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                </svg>
                <span>Model Chat</span>
                <div style="flex: 1;"></div>
                <div class="connection-status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Connecting...</span>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="chat-empty-state" id="emptyState">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                    <p>Ask about the model to get started</p>
                    <p style="font-size: 0.75rem; margin-top: 0.5rem;">Try: "Show me the walls" or "Isolate the HVAC"</p>
                </div>
            </div>

            <div class="chat-loading" id="chatLoading">
                <div class="loading-dots">
                    <span></span><span></span><span></span>
                </div>
                <span>Processing...</span>
            </div>

            <div class="sample-queries">
                <div class="sample-queries-label">Try asking:</div>
                <div class="sample-queries-list">
                    <button class="sample-query-btn">Show all walls</button>
                    <button class="sample-query-btn">Isolate HVAC</button>
                    <button class="sample-query-btn">Top view</button>
                    <button class="sample-query-btn">Create section</button>
                    <button class="sample-query-btn">Explode model</button>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <input type="text" class="chat-input" id="chatInput"
                        placeholder="Ask about the model..." autocomplete="off">
                    <button class="send-btn" id="sendBtn" disabled>
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============= AUTH GUARD =============
        (function() {
            if (!localStorage.getItem('auth_token')) {
                window.location.href = '/login';
            }
        })();

        function logout() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('auth_user');
            window.location.href = '/login';
        }

        // ============= CONFIGURATION =============
        const APS_APP_URL = 'https://aps-codepen.autodesk.io';
        const BACKEND_API_URL = 'http://localhost:8000';

        // ============= STATE =============
        let viewer = null;
        let isLoading = false;
        let currentModelUrn = null;

        // ============= DOM ELEMENTS =============
        const elements = {
            viewer: document.getElementById('viewer'),
            viewerLoading: document.getElementById('viewerLoading'),
            chatMessages: document.getElementById('chatMessages'),
            chatLoading: document.getElementById('chatLoading'),
            chatInput: document.getElementById('chatInput'),
            sendBtn: document.getElementById('sendBtn'),
            modelSelect: document.getElementById('modelSelect'),
            emptyState: document.getElementById('emptyState'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText')
        };

        // ============= APS AUTHENTICATION =============

        /**
         * Generates access token for viewing models in the Model Derivative service.
         * @param {(string, number) => void} callback Function called with access token and expiry.
         */
        function getAccessToken(callback) {
            fetch(APS_APP_URL + '/api/token')
                .then(resp => resp.ok ? resp.json() : Promise.reject(resp))
                .then(credentials => callback(credentials.access_token, credentials.expires_in))
                .catch(err => {
                    console.error('Token error:', err);
                    showError('Could not get access token. See console for details.');
                });
        }

        /**
         * Initializes the viewer runtime and creates a new viewer instance.
         * @param {HTMLElement} container Container element for the viewer.
         * @param {object} config Additional viewer configuration.
         * @returns {Promise<Autodesk.Viewing.GuiViewer3D>} New viewer instance.
         */
        function initViewer(container, config) {
            return new Promise(function (resolve, reject) {
                Autodesk.Viewing.Initializer({ getAccessToken }, function () {
                    const viewerInstance = new Autodesk.Viewing.GuiViewer3D(container, config);
                    viewerInstance.start();
                    resolve(viewerInstance);
                });
            });
        }

        /**
         * Lists all models available for viewing from APS.
         * @returns {Promise<Array<{ name: string, urn: string }>>} List of models.
         */
        function listModels() {
            return fetch(APS_APP_URL + '/api/models')
                .then(resp => resp.ok ? resp.json() : Promise.reject(resp));
        }

        /**
         * Loads a specific model into the viewer.
         * @param {Autodesk.Viewing.GuiViewer3D} viewerInstance Target viewer.
         * @param {string} urn URN of the model in Model Derivative service.
         */
        function loadModel(viewerInstance, urn) {
            return new Promise((resolve, reject) => {
                elements.viewerLoading.style.display = 'block';
                elements.viewerLoading.querySelector('p').textContent = 'Loading model...';

                Autodesk.Viewing.Document.load(
                    'urn:' + urn,
                    doc => {
                        viewerInstance.loadDocumentNode(doc, doc.getRoot().getDefaultGeometry())
                            .then(model => {
                                elements.viewerLoading.style.display = 'none';
                                currentModelUrn = urn;
                                elements.sendBtn.disabled = false;
                                resolve(model);
                            })
                            .catch(reject);
                    },
                    (code, message, errors) => {
                        elements.viewerLoading.style.display = 'none';
                        console.error('Model load error:', code, message, errors);
                        showError('Could not load model. See console for details.');
                        reject(new Error(message));
                    }
                );
            });
        }

        // ============= CHAT FUNCTIONS =============

        function addMessage(content, type) {
            // Hide empty state
            elements.emptyState.style.display = 'none';

            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${type}`;

            if (type === 'user') {
                messageDiv.innerHTML = `
                    <div class="message-wrapper">
                        <span class="message-label">You</span>
                        <div class="chat-bubble">${escapeHtml(content)}</div>
                    </div>
                `;
            } else {
                const formatted = formatMessage(content);
                messageDiv.innerHTML = `
                    <div class="agent-avatar">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div class="message-wrapper">
                        <span class="message-label">Agent</span>
                        <div class="chat-bubble">${formatted}</div>
                    </div>
                `;
            }

            elements.chatMessages.appendChild(messageDiv);
            elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
        }

        function formatMessage(content) {
            return String(content)
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code style="background:#e5e7eb;padding:0.125rem 0.25rem;border-radius:0.25rem;">$1</code>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setLoading(loading) {
            isLoading = loading;
            elements.chatLoading.classList.toggle('visible', loading);
            elements.chatInput.disabled = loading;
            elements.sendBtn.disabled = loading || !viewer;
        }

        function showError(message) {
            addMessage(message, 'agent');
        }

        // ============= VIEWER OPERATIONS =============

        /**
         * Wrapper around viewer.search() that returns a Promise.
         * @param {string} text - Text to search for
         * @param {string[]} [attributeNames] - Optional attribute names to restrict search
         * @returns {Promise<number[]>} Array of matching dbIds
         */
        function viewerSearchAsync(text, attributeNames) {
            return new Promise((resolve) => {
                if (!viewer || !viewer.model) { resolve([]); return; }
                viewer.search(
                    text,
                    (dbIds) => resolve(dbIds || []),
                    () => resolve([]),
                    attributeNames || undefined
                );
            });
        }

        /**
         * Given a set of dbIds (which may include parent/group nodes),
         * expand them to include all leaf-node descendants.
         * In Revit models the tree is: Root > Category > Family Type > Instance (leaf)
         * So a category search may return parent nodes - we need their leaf children.
         */
        function expandToLeafNodes(dbIds) {
            const instanceTree = viewer.model.getInstanceTree();
            if (!instanceTree) return dbIds;

            const leafSet = new Set();

            function collectLeaves(nodeId) {
                let hasChildren = false;
                instanceTree.enumNodeChildren(nodeId, (childId) => {
                    hasChildren = true;
                    collectLeaves(childId);
                }, false);
                if (!hasChildren) {
                    leafSet.add(nodeId);
                }
            }

            for (const dbId of dbIds) {
                collectLeaves(dbId);
            }

            return Array.from(leafSet);
        }

        /**
         * Check if a dbId is a leaf node (no children).
         */
        function isLeafNode(dbId) {
            const instanceTree = viewer.model.getInstanceTree();
            if (!instanceTree) return true;
            let hasChildren = false;
            instanceTree.enumNodeChildren(dbId, () => { hasChildren = true; }, false);
            return !hasChildren;
        }

        /**
         * Search for elements matching category and/or property criteria.
         * Uses viewer.search() API and expands parent nodes to leaf descendants
         * before intersecting, which handles Revit's tree structure where
         * "Category" lives on parent nodes but "Level" lives on leaf instances.
         *
         * @param {Object} criteria
         * @param {string} criteria.category - Category to match (e.g., "Doors")
         * @param {string} criteria.propertyName - Property name (e.g., "Level")
         * @param {string} criteria.propertyValue - Property value (e.g., "lower floor")
         * @returns {Promise<number[]>} Array of matching leaf-node dbIds
         */
        async function searchModelElements(criteria) {
            if (!viewer || !viewer.model) return [];

            const { category, propertyName, propertyValue } = criteria;

            try {
                let categorLeafIds = null;  // null means "not filtered by category"
                let propertyLeafIds = null; // null means "not filtered by property"

                // Step 1: Category search
                if (category) {
                    // Try specific "Category" attribute first
                    let rawIds = await viewerSearchAsync(category, ['Category']);
                    console.log(`[Search] Category "${category}" in [Category]: ${rawIds.length} raw hits`);

                    // Fallback: try broader attribute names
                    if (rawIds.length === 0) {
                        rawIds = await viewerSearchAsync(category, ['Category', 'Type', 'Family']);
                        console.log(`[Search] Category "${category}" in [Category,Type,Family]: ${rawIds.length} raw hits`);
                    }

                    // Fallback: broad search (any property containing the category name)
                    if (rawIds.length === 0) {
                        rawIds = await viewerSearchAsync(category);
                        console.log(`[Search] Category "${category}" broad search: ${rawIds.length} raw hits`);
                    }

                    // Expand parent/group nodes to their leaf descendants
                    // In Revit: search for "Doors" may return the "Doors" category node,
                    // not individual door instances. We need the leaf children.
                    categorLeafIds = new Set(expandToLeafNodes(rawIds));
                    console.log(`[Search] Category "${category}": ${categorLeafIds.size} leaf elements after expansion`);
                }

                // Step 2: Property + value search
                if (propertyName && propertyValue) {
                    let rawIds = await viewerSearchAsync(propertyValue, [propertyName]);
                    console.log(`[Search] Property "${propertyName}=${propertyValue}": ${rawIds.length} raw hits`);

                    // Fallback: try common property name variations
                    if (rawIds.length === 0) {
                        const variations = {
                            'level': ['Level', 'Reference Level', 'Base Constraint', 'Schedule Level', 'Base Level'],
                            'material': ['Material', 'Structural Material', 'Material Type'],
                            'type': ['Type', 'Type Name', 'Family and Type', 'System Type'],
                        };
                        const alts = variations[propertyName.toLowerCase()] || [];
                        for (const alt of alts) {
                            rawIds = await viewerSearchAsync(propertyValue, [alt]);
                            if (rawIds.length > 0) {
                                console.log(`[Search] Property fallback "${alt}=${propertyValue}": ${rawIds.length} hits`);
                                break;
                            }
                        }
                    }

                    // Last fallback: broad search for the value
                    if (rawIds.length === 0) {
                        rawIds = await viewerSearchAsync(propertyValue);
                        console.log(`[Search] Broad search for "${propertyValue}": ${rawIds.length} raw hits`);
                    }

                    // Expand and filter to leaf nodes
                    propertyLeafIds = new Set(expandToLeafNodes(rawIds));
                    console.log(`[Search] Property "${propertyName}=${propertyValue}": ${propertyLeafIds.size} leaf elements after expansion`);

                } else if (propertyValue && !propertyName && !category) {
                    // Only value, no property name or category
                    const rawIds = await viewerSearchAsync(propertyValue);
                    propertyLeafIds = new Set(expandToLeafNodes(rawIds));
                    console.log(`[Search] Broad value "${propertyValue}": ${propertyLeafIds.size} leaf elements`);
                }

                // Step 3: Intersect results
                let finalIds;

                if (categorLeafIds !== null && propertyLeafIds !== null) {
                    // Both criteria: intersect
                    finalIds = Array.from(categorLeafIds).filter(id => propertyLeafIds.has(id));
                    console.log(`[Search] Intersected: ${categorLeafIds.size} (category) x ${propertyLeafIds.size} (property) = ${finalIds.length} elements`);
                } else if (categorLeafIds !== null) {
                    finalIds = Array.from(categorLeafIds);
                } else if (propertyLeafIds !== null) {
                    finalIds = Array.from(propertyLeafIds);
                } else {
                    console.log('[Search] No search criteria provided');
                    return [];
                }

                console.log(`[Search] Final result: ${finalIds.length} elements`);
                return finalIds;

            } catch (error) {
                console.error('[Search] Error:', error);
                return [];
            }
        }

        async function executeViewerOperation(operation) {
            if (!viewer) return { success: false, error: 'Viewer not initialized' };

            const { type, params } = operation;

            try {
                switch (type) {
                    case 'select':
                        viewer.select(params.dbIds || []);
                        break;
                    case 'clearSelection':
                        viewer.clearSelection();
                        break;
                    case 'searchByProperty':
                    case 'selectByProperty':
                        // Advanced search - traverse tree, check properties, match values
                        if (viewer.model) {
                            const searchCategory = params.category || '';
                            const searchProperty = params.property || params.property_name || '';
                            const searchValue = params.value || '';

                            console.log('Advanced search:', { category: searchCategory, property: searchProperty, value: searchValue });

                            const foundIds = await searchModelElements({
                                category: searchCategory,
                                propertyName: searchProperty,
                                propertyValue: searchValue
                            });

                            console.log('Found elements:', foundIds.length, foundIds);
                            window.lastSearchResults = foundIds;

                            if (foundIds.length > 0) {
                                viewer.isolate(foundIds);
                                viewer.select(foundIds);
                                viewer.fitToView(foundIds);
                                console.log('Selection applied to', foundIds.length, 'elements');
                            } else {
                                console.log('No elements found matching criteria');
                            }
                        }
                        break;
                    case 'isolate':
                        // Support both dbIds and search criteria
                        if (params.dbIds && params.dbIds.length > 0) {
                            viewer.isolate(params.dbIds);
                        } else if (params.category || params.property || params.value) {
                            // Search and isolate
                            const isolateIds = await searchModelElements({
                                category: params.category || '',
                                propertyName: params.property || '',
                                propertyValue: params.value || ''
                            });
                            if (isolateIds.length > 0) {
                                viewer.isolate(isolateIds);
                                viewer.select(isolateIds);
                                viewer.fitToView(isolateIds);
                            }
                        } else if (window.lastSearchResults && window.lastSearchResults.length > 0) {
                            // Use last search results
                            viewer.isolate(window.lastSearchResults);
                        } else {
                            console.log('Isolate: No elements specified and no search results available');
                        }
                        break;
                    case 'hide':
                        // Support both dbIds and search criteria
                        if (params.dbIds && params.dbIds.length > 0) {
                            viewer.hide(params.dbIds);
                        } else if (params.category || params.property || params.value) {
                            const hideIds = await searchModelElements({
                                category: params.category || '',
                                propertyName: params.property || '',
                                propertyValue: params.value || ''
                            });
                            if (hideIds.length > 0) {
                                viewer.hide(hideIds);
                            }
                        } else if (window.lastSearchResults && window.lastSearchResults.length > 0) {
                            viewer.hide(window.lastSearchResults);
                        }
                        break;
                    case 'show':
                        if (params.dbIds && params.dbIds.length > 0) {
                            viewer.show(params.dbIds);
                        } else if (params.category || params.property || params.value) {
                            const showIds = await searchModelElements({
                                category: params.category || '',
                                propertyName: params.property || '',
                                propertyValue: params.value || ''
                            });
                            if (showIds.length > 0) {
                                viewer.show(showIds);
                                viewer.select(showIds);
                                viewer.fitToView(showIds);
                            }
                        } else {
                            viewer.showAll();
                        }
                        break;
                    case 'showAll':
                        viewer.showAll();
                        viewer.isolate();
                        break;
                    case 'fitToView':
                        viewer.fitToView(params.dbIds || undefined, undefined, true);
                        break;
                    case 'setCameraPreset':
                        setCameraPreset(params.preset);
                        break;
                    case 'setCamera':
                        const pos = new THREE.Vector3(...params.position);
                        const target = new THREE.Vector3(...params.target);
                        const up = params.up ? new THREE.Vector3(...params.up) : null;
                        viewer.navigation.setView(pos, target, up);
                        viewer.impl.syncCamera();
                        viewer.impl.invalidate(true);
                        break;
                    case 'createSection':
                        createSection(params.plane, params.offset || 0);
                        break;
                    case 'clearSection':
                        viewer.setCutPlanes(null);
                        break;
                    case 'explode':
                        viewer.explode(params.scale || 1);
                        break;
                    case 'measure':
                        await startMeasurement(params.type || 'distance');
                        break;
                    case 'clearMeasurements':
                        const measureExt = viewer.getExtension('Autodesk.Measure');
                        if (measureExt) measureExt.deactivate();
                        break;
                    default:
                        console.warn('Unknown operation:', type);
                }
                return { success: true };
            } catch (error) {
                console.error('Viewer operation error:', error);
                return { success: false, error: error.message };
            }
        }

        function setCameraPreset(preset) {
            if (!viewer || !viewer.model) return;

            const bbox = viewer.model.getBoundingBox();
            const center = bbox.center();
            const size = bbox.size();
            const maxDim = Math.max(size.x, size.y, size.z);
            const distance = maxDim * 2;

            let position;
            let up = new THREE.Vector3(0, 0, 1);

            switch (preset) {
                case 'front':
                    position = new THREE.Vector3(center.x, center.y - distance, center.z);
                    break;
                case 'back':
                    position = new THREE.Vector3(center.x, center.y + distance, center.z);
                    break;
                case 'top':
                    position = new THREE.Vector3(center.x, center.y, center.z + distance);
                    up = new THREE.Vector3(0, 1, 0);
                    break;
                case 'bottom':
                    position = new THREE.Vector3(center.x, center.y, center.z - distance);
                    up = new THREE.Vector3(0, -1, 0);
                    break;
                case 'left':
                    position = new THREE.Vector3(center.x - distance, center.y, center.z);
                    break;
                case 'right':
                    position = new THREE.Vector3(center.x + distance, center.y, center.z);
                    break;
                case 'iso':
                case 'iso_front':
                    position = new THREE.Vector3(
                        center.x + distance * 0.7,
                        center.y - distance * 0.7,
                        center.z + distance * 0.7
                    );
                    break;
                case 'iso_back':
                    position = new THREE.Vector3(
                        center.x - distance * 0.7,
                        center.y + distance * 0.7,
                        center.z + distance * 0.7
                    );
                    break;
                default:
                    return;
            }

            viewer.navigation.setView(position, center, up);
            viewer.impl.syncCamera();
            viewer.impl.invalidate(true);
        }

        function createSection(plane, offset) {
            if (!viewer || !viewer.model) return;

            const bbox = viewer.model.getBoundingBox();
            const center = bbox.center();

            let sectionPlane;
            switch (plane.toUpperCase()) {
                case 'X':
                    sectionPlane = new THREE.Vector4(1, 0, 0, -(center.x + offset));
                    break;
                case 'Y':
                    sectionPlane = new THREE.Vector4(0, 1, 0, -(center.y + offset));
                    break;
                case 'Z':
                    sectionPlane = new THREE.Vector4(0, 0, 1, -(center.z + offset));
                    break;
                default:
                    return;
            }

            viewer.setCutPlanes([sectionPlane]);
        }

        async function startMeasurement(type) {
            const measureExt = await viewer.loadExtension('Autodesk.Measure');
            if (measureExt) {
                measureExt.activate(type);
            }
        }

        
        // ============= MODEL PROPERTIES EXTRACTION =============

        let modelMetadata = null;

        /**
         * Extract available properties from the model for AI context
         */
        async function extractModelMetadata() {
            if (!viewer || !viewer.model) return null;

            const metadata = {
                categories: [],
                properties: [],
                searchableProps: [],
                elementCount: 0
            };

            try {
                const instanceTree = viewer.model.getInstanceTree();
                if (!instanceTree) return metadata;

                // Get all dbIds
                const allDbIds = [];
                instanceTree.enumNodeChildren(instanceTree.getRootId(), (dbId) => {
                    allDbIds.push(dbId);
                }, true);

                metadata.elementCount = allDbIds.length;

                // Sample elements to discover properties
                const sampleSize = Math.min(30, allDbIds.length);
                const sampleIds = allDbIds.sort(() => 0.5 - Math.random()).slice(0, sampleSize);

                const propertyMap = new Map();
                const categorySet = new Set();

                for (const dbId of sampleIds) {
                    const props = await getPropertiesAsync(dbId);
                    if (!props) continue;

                    // Track categories
                    const catProp = props.properties?.find(p =>
                        p.displayName === 'Category' || p.attributeName === 'Category'
                    );
                    if (catProp?.displayValue) {
                        categorySet.add(catProp.displayValue);
                    }

                    // Track properties
                    for (const prop of props.properties || []) {
                        const key = prop.displayName || prop.attributeName;
                        if (!key || key.startsWith('__')) continue;

                        if (!propertyMap.has(key)) {
                            propertyMap.set(key, {
                                name: key,
                                category: prop.displayCategory || 'General',
                                sampleValues: []
                            });
                        }

                        const info = propertyMap.get(key);
                        if (prop.displayValue &&
                            info.sampleValues.length < 3 &&
                            !info.sampleValues.includes(String(prop.displayValue))) {
                            info.sampleValues.push(String(prop.displayValue));
                        }
                    }
                }

                metadata.categories = Array.from(categorySet).sort();
                metadata.properties = Array.from(propertyMap.values());

                // Identify searchable properties
                const commonSearch = ['Category', 'Type', 'Family', 'Level', 'Material',
                    'Material Type', 'Name', 'Mark', 'Type Name', 'System Type'];
                metadata.searchableProps = metadata.properties
                    .filter(p => commonSearch.some(cs =>
                        p.name.toLowerCase().includes(cs.toLowerCase())
                    ))
                    .map(p => p.name);

                console.log('Model metadata extracted:', metadata);
                modelMetadata = metadata;
                return metadata;

            } catch (error) {
                console.error('Error extracting model metadata:', error);
                return metadata;
            }
        }

        function getPropertiesAsync(dbId) {
            return new Promise((resolve) => {
                viewer.getProperties(dbId, resolve, () => resolve(null));
            });
        }

        /**
         * Get model context for API calls
         */
        function getModelContext() {
            return {
                selected_ids: viewer ? viewer.getSelection() : [],
                model_urn: currentModelUrn,
                metadata: modelMetadata ? {
                    categories: modelMetadata.categories,
                    searchable_properties: modelMetadata.searchableProps,
                    element_count: modelMetadata.elementCount
                } : null
            };
        }


        // ============= API COMMUNICATION =============

        async function sendMessage(message) {
            addMessage(message, 'user');
            setLoading(true);

            try {
                const token = localStorage.getItem('auth_token');
                const response = await fetch(`${BACKEND_API_URL}/api/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                    },
                    body: JSON.stringify({
                        query: message,
                        model_context: getModelContext()
                    })
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                // DEBUG: Log full response
                console.log('=== API Response ===');
                console.log('Full response:', data);
                console.log('Message:', data.message);
                console.log('Viewer actions:', data.viewer_actions);
                console.log('Agents used:', data.agents_used);
                console.log('====================');

                // Show message
                addMessage(data.message || 'Operation completed.', 'agent');

                // Execute viewer actions with intersection support
                if (data.viewer_actions && Array.isArray(data.viewer_actions)) {
                    console.log('Executing viewer actions:', data.viewer_actions.length);

                    // Collect all search operations and intersect their results
                    const searchOps = data.viewer_actions.filter(a =>
                        a.operation === 'searchByProperty' || a.operation === 'selectByProperty'
                    );
                    const otherOps = data.viewer_actions.filter(a =>
                        a.operation !== 'searchByProperty' && a.operation !== 'selectByProperty'
                    );

                    if (searchOps.length > 1) {
                        // Multiple search operations: run all searches, then intersect
                        console.log(`Intersecting ${searchOps.length} search operations`);
                        let intersectedIds = null;

                        for (const action of searchOps) {
                            const params = action.params || {};
                            const foundIds = await searchModelElements({
                                category: params.category || '',
                                propertyName: params.property || params.property_name || '',
                                propertyValue: params.value || ''
                            });
                            console.log(`Search "${action.description}": ${foundIds.length} results`);

                            if (intersectedIds === null) {
                                intersectedIds = new Set(foundIds);
                            } else {
                                // Intersect with previous results
                                const currentSet = new Set(foundIds);
                                intersectedIds = new Set([...intersectedIds].filter(id => currentSet.has(id)));
                            }
                        }

                        const finalIds = Array.from(intersectedIds || []);
                        console.log(`Intersection result: ${finalIds.length} elements`);
                        window.lastSearchResults = finalIds;

                        if (finalIds.length > 0) {
                            viewer.isolate(finalIds);
                            viewer.select(finalIds);
                            viewer.fitToView(finalIds);
                        }

                        // Execute remaining non-search operations (fitToView etc.)
                        for (const action of otherOps) {
                            if (action.operation === 'fitToView' && finalIds.length > 0) {
                                // Already fit to view above, skip duplicate
                                continue;
                            }
                            await executeViewerOperation({
                                type: action.operation,
                                params: action.params || {}
                            });
                        }
                    } else {
                        // Single or no search operation: execute sequentially as normal
                        for (const action of data.viewer_actions) {
                            await executeViewerOperation({
                                type: action.operation,
                                params: action.params || {}
                            });
                        }
                    }
                }

            } catch (error) {
                console.error('API error:', error);
                addMessage(`Error: ${error.message}`, 'agent');
            } finally {
                setLoading(false);
            }
        }

        async function checkBackendHealth() {
            try {
                const response = await fetch(`${BACKEND_API_URL}/api/health`);
                if (response.ok) {
                    elements.statusDot.classList.add('connected');
                    elements.statusText.textContent = 'Connected';
                    return true;
                }
            } catch (error) {
                console.warn('Backend health check failed:', error);
            }
            elements.statusDot.classList.remove('connected');
            elements.statusText.textContent = 'Disconnected';
            return false;
        }

        // ============= EVENT HANDLERS =============

        elements.sendBtn.addEventListener('click', () => {
            const message = elements.chatInput.value.trim();
            if (message && !isLoading) {
                elements.chatInput.value = '';
                sendMessage(message);
            }
        });

        elements.chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                elements.sendBtn.click();
            }
        });

        elements.modelSelect.addEventListener('change', async (e) => {
            const urn = e.target.value;
            if (urn && viewer) {
                try {
                    await loadModel(viewer, urn);
                    addMessage(`Model loaded successfully.`, 'agent');

                    // Add click event to log selected element IDs
                    viewer.addEventListener(Autodesk.Viewing.SELECTION_CHANGED_EVENT, (e) => {
                        if (e.dbIdArray && e.dbIdArray.length > 0) {
                            console.log('=== SELECTED ELEMENT ===');
                            console.log('dbIds:', e.dbIdArray);
                            // Get properties of first selected element
                            viewer.getProperties(e.dbIdArray[0], (props) => {
                                console.log('Name:', props.name);
                                console.log('Category:', props.properties?.find(p => p.displayName === 'Category')?.displayValue || 'N/A');
                                console.log('All properties:', props);
                                console.log('========================');
                            });
                        }
                    });
                    console.log('Selection event listener added');
                } catch (error) {
                    console.error('Failed to load model:', error);
                }
            }
        });

        // Sample query buttons
        document.querySelectorAll('.sample-query-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const query = btn.textContent.trim();
                elements.chatInput.value = query;
                elements.sendBtn.click();
            });
        });

        // ============= INITIALIZATION =============

        async function init() {
            try {
                // Initialize viewer
                elements.viewerLoading.querySelector('p').textContent = 'Initializing viewer...';
                viewer = await initViewer(elements.viewer, {
                    extensions: [
                        'Autodesk.Viewing.MarkupsCore',
                        'Autodesk.Viewing.MarkupsGui',
                        'Autodesk.Measure',
                        'Autodesk.Section'
                    ]
                });

                // Load available models
                elements.viewerLoading.querySelector('p').textContent = 'Loading model list...';
                const models = await listModels();

                // Populate model selector
                elements.modelSelect.innerHTML = '<option value="">Select a model...</option>';
                models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.urn;
                    option.textContent = model.name;
                    elements.modelSelect.appendChild(option);
                });

                // Auto-load first model if available
                if (models.length > 0) {
                    elements.modelSelect.value = models[0].urn;
                    await loadModel(viewer, models[0].urn);
                } else {
                    elements.viewerLoading.style.display = 'none';
                }

                // Check backend health
                await checkBackendHealth();
                setInterval(checkBackendHealth, 30000);

            } catch (error) {
                console.error('Initialization error:', error);
                elements.viewerLoading.querySelector('p').textContent = 'Failed to initialize. Check console.';
            }
        }

        init();
    </script>
